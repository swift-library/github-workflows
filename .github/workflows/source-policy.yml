name: Source policy
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  policy:
    uses: ./.github/workflows/policy.yml
    with:
      allow-terms: 'ChatGPT

        Codex

        Cursor

        Claude'
