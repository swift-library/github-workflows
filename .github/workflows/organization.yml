name: Organization
on:
  workflow_call:
    secrets:
      organization-token:
        description: Token with Administration read access to selected members for online mode
        required: false
    inputs:
      organization:
        type: string
        required: true
      standard-repository:
        type: string
        required: true
      standard-revision:
        type: string
        required: true
      members:
        type: string
        default: all
      mode:
        type: string
        default: public
permissions: {}
jobs:
  organization:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .shared
        persist-credentials: false
    - name: Validate standard revision
      env:
        REVISION: ${{ inputs.standard-revision }}
        MODE: ${{ inputs.mode }}
      shell: bash
      run: '[[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]

        [[ "$MODE" == public || "$MODE" == online ]]'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.standard-repository }}
        ref: ${{ inputs.standard-revision }}
        path: standard
        persist-credentials: false
    - env:
        GITHUB_TOKEN: ${{ secrets.organization-token || github.token }}
        GH_TOKEN: ${{ secrets.organization-token || github.token }}
        ORGANIZATION: ${{ inputs.organization }}
        STANDARD_REPOSITORY: ${{ inputs.standard-repository }}
        MEMBERS: ${{ inputs.members }}
        MODE: ${{ inputs.mode }}
      run: python3 .shared/scripts/check-organization.py --root standard --organization "$ORGANIZATION" --standard-repository
        "$STANDARD_REPOSITORY" --members "$MEMBERS" --mode "$MODE"
