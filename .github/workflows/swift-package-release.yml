name: Swift package release
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      accepted_commit:
        type: string
        required: true
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
    - name: Resolve the executing reusable workflow revision
      id: workflow
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW_FILE: swift-package-release.yml
      shell: bash
      run: "set -euo pipefail\nrecord=$(gh api \"repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT\"\
        )\nreferences=$(jq --arg file \"/.github/workflows/$WORKFLOW_FILE@\" '[.referenced_workflows[]? | select(.path | contains($file))]\
        \ | unique_by([.path, .sha])' <<< \"$record\")\nif [[ $(jq 'length' <<< \"$references\") == 0 && ${GITHUB_REPOSITORY##*/}\
        \ == github-workflows ]]; then\n  printf 'repository=%s\\nsha=%s\\n' \"$GITHUB_REPOSITORY\" \"$GITHUB_WORKFLOW_SHA\"\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  jq -e 'length == 1 and (.[0].sha | test(\"^[0-9a-f]{40}$\"))' <<< \"$references\"\
        \ >/dev/null\n  jq -r '.[0] | \"repository=\" + (.path | split(\"/\")[0:2] | join(\"/\")), \"sha=\" + .sha' <<< \"\
        $references\" >> \"$GITHUB_OUTPUT\"\nfi"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.workflow.outputs.repository }}
        ref: ${{ steps.workflow.outputs.sha }}
        path: .shared
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.accepted_commit }}
        path: member
        fetch-depth: 0
        persist-credentials: false
    - name: Install schema validator
      run: |
        python3 -m venv .shared/.build/venv
        .shared/.build/venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -r .shared/requirements.txt
        echo "$GITHUB_WORKSPACE/.shared/.build/venv/bin" >> "$GITHUB_PATH"
    - name: Verify accepted release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
        ACCEPTED_COMMIT: ${{ inputs.accepted_commit }}
      run: python3 .shared/scripts/verify-release.py --root member --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
        --accepted-commit "$ACCEPTED_COMMIT" --scratch "$RUNNER_TEMP/release"
    outputs:
      workflow_repository: ${{ steps.workflow.outputs.repository }}
      workflow_sha: ${{ steps.workflow.outputs.sha }}
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ needs.verify.outputs.workflow_repository }}
        ref: ${{ needs.verify.outputs.workflow_sha }}
        path: .shared
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.accepted_commit }}
        path: member
        fetch-depth: 0
        persist-credentials: false
    - name: Install schema validator
      run: |
        python3 -m venv .shared/.build/venv
        .shared/.build/venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -r .shared/requirements.txt
        echo "$GITHUB_WORKSPACE/.shared/.build/venv/bin" >> "$GITHUB_PATH"
    - name: Verify accepted release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
        ACCEPTED_COMMIT: ${{ inputs.accepted_commit }}
      run: python3 .shared/scripts/verify-release.py --root member --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
        --accepted-commit "$ACCEPTED_COMMIT" --scratch "$RUNNER_TEMP/release" --publish
    needs: verify
