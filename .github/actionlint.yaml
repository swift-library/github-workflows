self-hosted-runner:
  labels:
    - macos-26
paths:
  .github/workflows/*.yml:
    ignore:
      # Documented job properties missing from actionlint 1.7.12's context type.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
      - '^property "workflow_(repository|sha)" is not defined in object type \{check_run_id: number; container:'
